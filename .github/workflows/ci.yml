name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-26
    env:
      # Keep CI on the Swift generation used for signed releases. Xcode 16.4's
      # region-isolation checker rejects the Accessibility traversal closures.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build unsigned Release
        run: >-
          xcodebuild
          -project ReasonDeck.xcodeproj
          -scheme ReasonDeck
          -configuration Release
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
