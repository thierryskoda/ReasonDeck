name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build unsigned Release
        run: >-
          xcodebuild
          -project ReasonDeck.xcodeproj
          -scheme ReasonDeck
          -configuration Release
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
