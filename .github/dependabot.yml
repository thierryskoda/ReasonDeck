# The workflows pin actions by commit SHA. Dependabot keeps those pins current
# so a pinned action cannot silently rot on an unpatched revision.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      # Must stay a non-releasable type: scripts/next-release.sh would otherwise
      # cut and publish a release for a dependency bump.
      prefix: ci
    open-pull-requests-limit: 5
